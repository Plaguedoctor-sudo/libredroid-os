name: "QWERTY (US/International)"
language: "en"
rows:
  - keys: ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"]
  - keys: ["a", "s", "d", "f", "g", "h", "j", "k", "l"]
  - keys: ["Shift", "z", "x", "c", "v", "b", "n", "m", "Backspace"]
  - keys: ["?123", "Globe", "Space", ".", "Return"]
features:
  swipe_typing: true
  swipe_backspace_delete_word: true
  spacebar_cursor_slide: true
  haptic_feedback: true
