[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-python-sovereign"
version = "0.1.0"
description = "FreeStack Sovereign Python Application Template"
authors = [{ name = "FreeStack Team", email = "dev@freestack.org" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
sample-python = "main:main"
