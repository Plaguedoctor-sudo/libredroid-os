  - id: unbound
    name: "unbound"
    tier: core
    license: { spdx: ["BSD-3-Clause"] }
    rules:
      satisfies: ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R11", "R12"]
    upstream:
      vcs: git
      repo: "https://github.com/NLnetLabs/unbound"
      forge: github
