[project]
name = "freestack"
version = "0.1.0"
description = "Hermetic, hash-pinned, telemetry-free reproducible OS build system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "cryptography>=3.4"
]

[project.scripts]
fsbuild = "tools.fsbuild.fsbuild:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
