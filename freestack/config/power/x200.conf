# FreeStack Target Power & Thermal Tuning: ThinkPad X200 (Task 14.7)

[Governor]
default=powersave
turbo_boost=disabled
energy_performance_preference=balance_power

[Thermal]
trip_point_passive_celsius=72
trip_point_critical_celsius=90
fan_control_mode=thinkpad_acpi
fan_level_idle=1
fan_level_load=7

[Battery]
start_charge_thresh_percent=40
stop_charge_thresh_percent=80

[PCIe]
aspm_policy=powersupersave
runtime_pm=auto
