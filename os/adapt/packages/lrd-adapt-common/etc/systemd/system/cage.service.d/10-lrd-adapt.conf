[Unit]
After=lrd-adapt-validate.service lrd-bootgate.service
Requires=lrd-adapt-apply.service
Wants=lrd-adapt-validate.service
# a broken compositor must not take the machine with it
StartLimitIntervalSec=90
StartLimitBurst=3
StartLimitAction=start lrd-safe.target

[Service]
# the wrapper owns variant cycling, so it must be the ExecStart
ExecStart=
ExecStart=/usr/lib/lrd/adapt/lrd-cage-run
# it starts safe.target itself when every variant fails, so do not let systemd flap
Restart=on-failure
RestartSec=3
