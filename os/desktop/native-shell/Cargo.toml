[package]
name = "lrd-native-shell"
version = "0.2.0"
edition = "2021"
authors = ["LibreDroid Core Team"]
description = "Pure Native Wayland Shell in Rust + Slint with zero browser overhead and native subsurface compositing"

[dependencies]
slint = { version = "1.3", default-features = false, features = ["backend-winit", "compat-1-2", "renderer-femtovg"] }
tokio = { version = "1.36", features = ["rt-multi-thread", "net", "io-util", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.3"

[[bin]]
name = "lrd-native-shell"
path = "src/main.rs"
