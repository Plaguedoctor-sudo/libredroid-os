Syntax 4

SectionDevice."Earpiece" {
	Comment "Earpiece Speaker (Voice Call Handset)"
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
	EnableSequence [
		cset "name='Speaker Playback Switch' off"
		cset "name='Earpiece Playback Switch' on"
		cset "name='Earpiece Playback Volume' 80%"
	]
	DisableSequence [
		cset "name='Earpiece Playback Switch' off"
	]
}

SectionDevice."Speakerphone" {
	Comment "Loudspeaker (Voice Call Handsfree)"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
	EnableSequence [
		cset "name='Earpiece Playback Switch' off"
		cset "name='Speaker Playback Switch' on"
		cset "name='Speaker Playback Volume' 90%"
	]
	DisableSequence [
		cset "name='Speaker Playback Switch' off"
	]
}

SectionDevice."VoiceMic" {
	Comment "Handset Bottom Microphone with Top Mic Noise Reduction"
	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
	EnableSequence [
		cset "name='Main Mic Switch' on"
		cset "name='Top Mic Switch' on"
		cset "name='DSP Noise Suppression Switch' on"
		cset "name='Main Mic Volume' 85%"
		cset "name='Top Mic Volume' 75%"
	]
	DisableSequence [
		cset "name='DSP Noise Suppression Switch' off"
		cset "name='Main Mic Switch' off"
		cset "name='Top Mic Switch' off"
	]
}
