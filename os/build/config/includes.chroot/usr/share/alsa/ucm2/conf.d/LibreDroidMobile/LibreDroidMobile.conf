Syntax 4

SectionUseCase."HiFi" {
	File "/LibreDroidMobile/HiFi.conf"
	Comment "LibreDroid High Fidelity Media Playback & Capture"
}

SectionUseCase."VoiceCall" {
	File "/LibreDroidMobile/VoiceCall.conf"
	Comment "LibreDroid Cellular & VoIP Voice Call Matrix"
}

SectionDefaults [
	cset "name='Master Playback Volume' 80%"
	cset "name='Master Playback Switch' on"
	cset "name='Capture Volume' 75%"
	cset "name='Capture Switch' on"
]
