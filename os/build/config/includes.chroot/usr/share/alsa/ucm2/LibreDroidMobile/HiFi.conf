Syntax 4

SectionDevice."Speaker" {
	Comment "Bottom Loudspeaker (Media Playback)"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
	EnableSequence [
		cset "name='Speaker Playback Switch' on"
		cset "name='Earpiece Playback Switch' off"
		cset "name='Speaker Playback Volume' 85%"
	]
	DisableSequence [
		cset "name='Speaker Playback Switch' off"
	]
}

SectionDevice."Headphones" {
	Comment "3.5mm TRRS Headphone Jack"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Speaker Playback Switch' off"
		cset "name='Headphone Playback Switch' on"
		cset "name='Headphone Playback Volume' 75%"
	]
	DisableSequence [
		cset "name='Headphone Playback Switch' off"
	]
}

SectionDevice."Mic" {
	Comment "Primary Bottom Microphone"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
	EnableSequence [
		cset "name='Main Mic Switch' on"
		cset "name='Top Mic Switch' off"
		cset "name='Main Mic Volume' 80%"
	]
	DisableSequence [
		cset "name='Main Mic Switch' off"
	]
}

SectionDevice."TopMic" {
	Comment "Secondary Top Microphone (Camcorder / Ambient)"
	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
	EnableSequence [
		cset "name='Top Mic Switch' on"
		cset "name='Top Mic Volume' 70%"
	]
	DisableSequence [
		cset "name='Top Mic Switch' off"
	]
}
