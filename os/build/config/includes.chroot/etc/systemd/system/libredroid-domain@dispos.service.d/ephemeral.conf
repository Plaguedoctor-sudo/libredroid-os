[Service]
MemoryMax=512M
# rootfs in RAM, all writes discarded on stop. If nspawn rejects
# --volatile=overlay on your filesystem, fall back to --volatile=yes.
ExecStart=
ExecStart=/usr/bin/systemd-nspawn --quiet --machine=dispos \
  --directory=/var/lib/libredroid/domains/dispos \
  --volatile=overlay \
  --network-namespace-path=/run/netns/lrd-dispos \
  --hostname=dispos --register=yes --resolv-conf=off \
  --bind=/run/libredroid/dispos:/run/libredroid/dispos \
  --setenv=LIBREDROID_DOMAIN=dispos \
  --setenv=XDG_RUNTIME_DIR=/run/libredroid/dispos \
  --setenv=WAYLAND_DISPLAY=wayland-lrd-dispos
