# ==============================================================================
# LibreDroid Acoustic Echo Cancellation (AEC) & Noise Suppression
# os/build/config/includes.chroot/etc/pipewire/pipewire.conf.d/50-libredroid-echo-cancel.conf
#
# Provides WebRTC hardware-calibrated echo cancellation for mobile speakerphone mode.
# ==============================================================================

context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.name = "libredroid_echo_cancel"
            node.description = "LibreDroid WebRTC Acoustic Echo Cancel & Noise Suppressor"
            source.props = {
                filter.smart = true
                node.passive = false
                priority.session = 1500
            }
            sink.props = {
                filter.smart = true
                node.passive = false
                priority.session = 1500
            }
            aec.args = {
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.transient_suppression = true
                webrtc.voice_detection = true
            }
        }
    }
]
