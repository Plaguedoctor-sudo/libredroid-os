# ==============================================================================
# LibreDroid Mobile Audio Focus Policy & Bluetooth HFP
# os/build/config/includes.chroot/etc/wireplumber/wireplumber.conf.d/60-libredroid-mobile-policy.conf
# ==============================================================================

wireplumber.profiles = {
    main = {
        # Audio focus rule: Voice communication immediately ducks background audio
        libredroid.audio-focus = {
            duck-level = 0.2
            pause-on-call = true
            cork-music-streams = true
        }

        # Bluetooth HFP/HSP wideband speech codecs
        bluetooth.codecs = [
            "msbc",
            "cvsd",
            "aptx",
            "aac",
            "sbc"
        ]
    }
}

monitor.bluez.rules = [
    {
        matches = [
            {
                device.name = "~bluez_card.*"
            }
        ]
        actions = {
            update-props = {
                bluez5.roles = [ "hfp_hf", "hfp_ag", "a2dp_sink", "a2dp_source" ]
                bluez5.enable-msbc = true
                bluez5.enable-sbc-xq = true
            }
        }
    }
]
