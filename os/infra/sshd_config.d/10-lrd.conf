Port 22
AddressFamily any
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AllowGroups lrd ssh
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
ClientAliveInterval 60
ClientAliveCountMax 3
LoginGraceTime 30
MaxAuthTries 4
MaxSessions 4
# no reverse DNS: faster and no leak
UseDNS no
# the store is where keys live, so sshd must be able to read them
# generate host keys on first boot, not at install (they must be per-device)
HostKey /etc/ssh/ssh_host_ed25519_key
