# LibreDroid MicroVM Hypervisor Configuration
# Subsystem: os/infra/domain/lrd-microvm
# Status: spec / reference implementation

# Pinned Hypervisor Virtual Machine Monitor (VMM)
HYPERVISOR_VMM="crosvm"
HYPERVISOR_LICENSE="BSD-3-Clause"
HYPERVISOR_FALLBACK_VMM="qemu-system-x86_64 -M microvm"
HYPERVISOR_UNPRIVILEGED_FALLBACK="bwrap-landlock-jail"

# Resource & Device Virtualization Bounds
DEFAULT_MEMORY="256M"
VAULT_MEMORY="256M"
TOR_GATEWAY_MEMORY="512M"
VIRTIO_NET=true
VIRTIO_GPU=true
VIRTIO_VSOCK=true
VIRTIO_FS=true
WAYLAND_SOCKET_PASSTHROUGH=true

# Security Isolation Bounds
KVM_DEVICE="/dev/kvm"
SECCOMP_FILTER="/etc/seccomp/microvm.json"
LANDLOCK_ABI_ENFORCEMENT=true
