# LibreDroid MicroVM Isolation Configuration
# Defines default RAM, CPU, and device passthrus for hardware-isolated microVMs

[defaults]
hypervisor = kvm
memory_mb = 512
cpus = 2
console = virtio-console
net = virtio-net
gpu = virgl

[vault]
memory_mb = 256
cpus = 1
net_enabled = false
tpm2_passthrough = true

[tor-gateway]
memory_mb = 512
cpus = 2
net_enabled = true
isolate_stream = true
