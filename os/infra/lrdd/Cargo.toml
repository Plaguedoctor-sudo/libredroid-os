[package]
name = "lrdd"
version = "0.2.0"
edition = "2021"
authors = ["LibreDroid Core Team"]
description = "LibreDroid Sovereign System Daemon replacing server.js with high-performance native IPC"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = { version = "3.14", features = ["tokio-1"] }
nix = { version = "0.28", features = ["socket", "ucred", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"

[[bin]]
name = "lrdd"
path = "src/main.rs"

[[bin]]
name = "lrdd-ctl"
path = "src/ctl.rs"
