# ==============================================================================
# LibreDroid Local DoT Resolver Configuration (Unbound)
# Spec compliance: LibreDroid System Design v0.1 §8c
# Target: /etc/unbound/unbound.conf.d/lrd-unbound.conf
#
# Principles:
# 1. Listen strictly on loopback (127.0.0.1:53 & ::1:53).
# 2. Refuse queries from non-local addresses.
# 3. Strict DNS-over-TLS (DoT) forwarding on port 853 to verified upstreams.
# 4. Mandatory DNSSEC validation and query name minimisation.
# ==============================================================================

server:
    verbosity: 1
    interface: 127.0.0.1
    interface: ::1
    port: 53

    # Protocol restrictions
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Access control: loopback only
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    # Privacy and security hardening
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    use-caps-for-id: no

    # Caching
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes

    # DNSSEC
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # TLS certificate validation for DoT
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

# Upstream DNS-over-TLS (Port 853) Forwarding
forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Quad9 (Default privacy upstream — strict no-logging)
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 2620:fe::fe@853#dns.quad9.net
    forward-addr: 2620:fe::9@853#dns.quad9.net
    # Cloudflare (Secondary fallback upstream)
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
    forward-addr: 2606:4700:4700::1001@853#cloudflare-dns.com
