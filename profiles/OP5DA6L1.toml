# LibreDroid Device Profile: OnePlus Pad Go (MediaTek Helio G99 / MT6789)
# Spec compliance: LibreDroid System Design v0.1 §2 & §4 (<120 lines)
# Canonical install target: /usr/share/profiles/OP5DA6L1.toml

[device]
codename = "OP5DA6L1"
aliases = ["OPD2304", "ossi"]
model = "OnePlus Pad Go"
manufacturer = "OnePlus"
form_factor = "tablet"
soc = "mt6789"
gpu = "Mali-G57 MC2"
arch = "arm64"
support_tier = "T2"

[android]
target_vndk = 33
halium_version = 13
kernel_min_version = "5.10.0"
binder_devices = ["binder", "hwbinder", "vndbinder"]
vendor_mount = "/vendor"

[display]
scale = 1.0
primary_output = "DSI-1"
resolution_width = 1720
resolution_height = 2408
diagonal_inches = 11.35
refresh_rate = 90
transform = "normal"
touch_device = "auto"

[hybris]
gralloc_version = "4.0"
hwcomposer_version = "2.3"
audio_backend = "pulseaudio-droid"
vndk_shim_band = "vndk-33"

[shell]
compositor = "phoc-hybris"
session_ui = "phosh"
desktop_scale = 1.0
# Firefox follows compositor scale (-1.0)
firefox_touch_scale = -1.0

[waydroid]
enable = true
container_scale = 1.0
freeze_on_idle = true
egress_isolated = true

[egress]
default_mode = "tunnel_only"
kill_switch = true
enforce_unbound = true
