[workspace]
resolver = "2"
members = [
    "core/capability",
    "core/lifecycle",
    "core/memory",
    "core/sandbox",
    "ipc/transport",
    "ipc/router",
    "ai/inference",
    "ai/context",
    "ai/intent",
    "ai/privacy-shield",
    "shell/compositor",
    "shell/convergence",
    "shell/osk",
    "shell/system-ui",
    "packaging/builder",
    "packaging/verifier",
    "packaging/installer",
    "security/vault",
    "security/telemetry-poison",
    "security/anti-predatory",
    "sdk/cli",
    "sdk/templates/rust-native",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Sovereign Application Platform Core Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Plaguedoctor-sudo/libredroid-os"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
capnp = "0.19"
nix = { version = "0.29", features = ["fs", "mman", "socket", "ucred", "signal", "user"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
ring = "0.17"
memmap2 = "0.9"
